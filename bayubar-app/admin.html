<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070a12">
<title>BAYU BAR — Administración</title>
<link rel="icon" type="image/webp" href="./assets/logo-bayubar-sm.webp">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/admin.css?v=20261110-visual02">
</head>
<body>

<!-- Inicio de sesión -->
<main id="loginView" class="login" hidden>
  <div class="login-card">
    <img src="./assets/logo-bayubar.webp" alt="BAYU BAR" width="120" height="120">
    <h1 class="dis">Administración</h1>
    <div id="setupNotice" class="info-box" hidden>
      Falta conectar la base de datos. Abre <b>js/config.js</b>, pega tu <b>Project URL</b> y tu clave <b>anon</b> de Supabase y recarga esta página. Los pasos están en el archivo <b>LEEME.md</b>.
    </div>
    <form id="loginForm" novalidate>
      <label class="field">Correo<input id="lEmail" type="email" autocomplete="username" required placeholder="tucorreo@gmail.com"></label>
      <label class="field">Contraseña<input id="lPass" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></label>
      <div id="loginError" class="error-box" role="alert" hidden></div>
      <button class="btn block" id="loginBtn" type="submit">Entrar</button>
    </form>
    <a class="back" href="./index.html">← Volver a la tienda</a>
  </div>
</main>

<!-- Aplicación -->
<div id="appView" hidden>
  <header class="ahead">
    <div class="awrap ahead-in">
      <div class="abrand"><img src="./assets/logo-bayubar-sm.webp" alt="" width="40" height="40"><div><b>BAYU BAR</b><small id="roleLabel"></small></div></div>
      <div class="ahead-right">
        <span class="who" id="whoEmail"></span>
        <button class="btn ghost sm" id="pwdBtn" type="button">Contraseña</button>
        <a class="btn ghost sm" href="./index.html" target="_blank" rel="noopener">Ver tienda</a>
        <button class="btn ghost sm" id="logoutBtn" type="button">Salir</button>
      </div>
    </div>
    <nav class="awrap tabs" id="tabs" aria-label="Secciones"></nav>
  </header>
  <main class="awrap" id="view" tabindex="-1"></main>
</div>

<dialog id="modal" aria-labelledby="modalTitle">
  <form id="modalForm" method="dialog" novalidate>
    <div class="m-head"><h2 class="dis" id="modalTitle"></h2><button class="xbtn" id="modalX" type="button" aria-label="Cerrar">×</button></div>
    <div class="m-body" id="modalBody"></div>
    <div id="modalError" class="error-box m-err" role="alert" hidden></div>
    <div class="m-foot"><button class="btn ghost" id="modalCancel" type="button">Cancelar</button><button class="btn" id="modalOk" type="submit">Guardar</button></div>
  </form>
</dialog>

<dialog id="ticketDialog" class="ticket-dialog" aria-labelledby="ticketTitle">
  <div class="ticket-dialog-head"><div><h2 id="ticketTitle">Ticket de compra</h2><p>Comprobante interno de venta</p></div><button class="xbtn" id="ticketClose" type="button" aria-label="Cerrar">×</button></div>
  <div id="ticketContent" class="ticket-content"></div>
  <div class="ticket-dialog-actions"><button class="btn ghost" id="ticketCloseBottom" type="button">Cerrar</button><a class="btn ok" id="ticketWhatsApp" href="#" target="_blank" rel="noopener" hidden>Compartir por WhatsApp</a><button class="btn" id="ticketPrint" type="button">Imprimir / Guardar PDF</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/common.js"></script>
<script src="./js/admin.js?v=20261110-direct-sales01"></script>
</body>
</html>
